# Production-like stack (ADR-019): the published images behind an HTTPS reverse proxy, as on
# a server. Run through deploy/deploy.sh, which verifies the images and sets API_IMAGE and
# WEB_IMAGE (by digest) in deploy/.env.release; secrets come from deploy/.env.
#
#   internet ──HTTPS :8443──► caddy ─(edge)─► web ─(internal)─► api ──► postgres
#
# `internal` has no route outside: a compromised api or web cannot reach the internet.
name: slotly-prod

services:
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    ports:
      - '8443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:?deploy.sh sets WEB_IMAGE in .env.release}
    environment:
      API_INTERNAL_URL: http://api:4000
    networks: [edge, internal]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: ${API_IMAGE:?deploy.sh sets API_IMAGE in .env.release}
    environment:
      # The app role: rows only (postgres/init-roles.sh)
      DATABASE_URL: postgres://slotly_app:${SLOTLY_APP_PASSWORD:?}@postgres:5432/slotly
      APP_ORIGIN: https://localhost:8443
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: Slotly <no-reply@slotly.local>
      # Only web, on the internal network, may set X-Forwarded-For; Caddy wrote the client's
      # address into it, so req.ip is the client, not web or Caddy (ADR-016, ADR-019)
      TRUSTED_PROXY: 172.30.20.0/24
      LOG_FORMAT: json
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # A release step, not a service: `docker compose run --rm migrate` (deploy.sh)
  migrate:
    image: ${API_IMAGE:?deploy.sh sets API_IMAGE in .env.release}
    command: ['node', 'dist/migrate.js']
    environment:
      # The owner role: DDL
      DATABASE_URL: postgres://slotly_owner:${SLOTLY_OWNER_PASSWORD:?}@postgres:5432/slotly
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [release]

  postgres:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      SLOTLY_OWNER_PASSWORD: ${SLOTLY_OWNER_PASSWORD:?}
      SLOTLY_APP_PASSWORD: ${SLOTLY_APP_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d slotly']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # No domain, so no real email: Mailpit catches what the API sends. Its UI only on this
  # machine; it also sits on edge, because a service only on `internal` cannot publish a port
  mailpit:
    image: axllent/mailpit:v1.33.1
    environment:
      MP_SMTP_DISABLE_RDNS: 'true'
    ports:
      - '127.0.0.1:8026:8025'
    networks: [internal, edge]
    restart: unless-stopped

networks:
  edge: {}
  internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.20.0/24

volumes:
  caddy-data:
  postgres-data:
