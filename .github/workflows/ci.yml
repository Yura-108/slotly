# Checks of every pull request and of main (ADR-017). Each job is a required status check
# of the main ruleset; a red job blocks the merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly on main: a full mutation run, and new advisories reach audit:prod without a commit
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

# Read-only token: CI checks code and never writes to the repository. A pull request from
# a fork runs on `pull_request` (not `pull_request_target`): no secrets, no write access
permissions:
  contents: read

# A new push to the same pull request cancels the outdated run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # Job names are the required status checks of the main ruleset: keep them stable
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # next.config.ts validates the web server environment; typegen and the build load it.
      # Nothing listens there: no step talks to the API
      API_INTERNAL_URL: http://127.0.0.1:4000
    steps:
      # Third-party actions are pinned to a commit SHA: a tag can be moved to other code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint (ESLint and module boundaries)
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Format
        run: pnpm format:check
      - name: Vulnerabilities in production dependencies
        run: pnpm audit:prod
      - name: Secrets in the working tree
        run: pnpm secrets:check

      # The committed contract must be what the code generates: a changed DTO or route
      # without regenerated files would give the web client stale types
      - name: API contract is up to date
        env:
          # Generation validates the configuration but never connects anywhere
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          APP_ORIGIN: http://localhost:3000
          SMTP_URL: smtp://localhost:1025
          EMAIL_FROM: Slotly CI <ci@slotly.test>
        run: |
          pnpm --filter @slotly/api openapi:generate
          pnpm --filter @slotly/web api:types
          if ! git diff --exit-code -- apps/api/openapi.json apps/web/src/shared/api/schema.d.ts; then
            echo "::error::openapi.json or schema.d.ts is out of date. Run: pnpm --filter @slotly/api openapi:generate && pnpm --filter @slotly/web api:types"
            exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Integration tests start PostgreSQL and Mailpit with testcontainers: the runner has Docker
      - run: pnpm test
      # Domain coverage thresholds (vitest.unit.config.mts); unit tests only, a few seconds
      - name: Domain coverage
        run: pnpm --filter @slotly/api test:coverage

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same PostgreSQL and Mailpit as local development (compose.yaml); Playwright then
      # builds and starts the API and web against its own database (testing.md §4)
      - name: Infrastructure
        run: docker compose up -d --wait
      # Playwright recommends installing, not caching, browsers: a restore takes as long
      - name: Browser
        run: pnpm --filter @slotly/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Evidence for a failure: the HTML report and, for failed tests only, traces, screenshots
      # and videos (playwright.config.ts). The repository is public, and so are artifacts:
      # they hold only throwaway e2e data — test accounts, test emails, nothing else
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      # From the release's checksums.txt: the binary is verified, not trusted by URL
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: a secret deleted three commits ago is still in git
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      # A green scan must mean "no secrets", not "the scanner finds nothing": it has to
      # find a planted one first. The token is assembled at run time, so no literal of it
      # is in this repository for the scan below (or secretlint) to report
      - name: Canary - gitleaks finds a planted secret
        run: |
          canary="$RUNNER_TEMP/canary"
          git init -q "$canary"
          printf 'const token = "xox%s-123456789012-1234567890123-AbCdEfGhIjKlMnOpQrStUvWx";\n' b > "$canary/leak.ts"
          git -C "$canary" add leak.ts
          git -C "$canary" -c user.name=ci -c user.email=ci@example.test commit -qm canary
          if ./gitleaks git --no-banner "$canary" > /dev/null 2>&1; then
            echo "::error::gitleaks did not find the planted secret"
            exit 1
          fi
      - name: Scan every commit
        run: ./gitleaks git --redact --no-banner --verbose .

  mutation:
    name: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit is needed to see what the change touched
          fetch-depth: 0
          persist-credentials: false
      # Stryker takes ~3.5 minutes on a runner (e2e: 1.5): it runs when the mutated code, its tests or its
      # tooling change, and weekly in full. The decision is inside the job (not `on.paths`),
      # so the required check always reports instead of waiting forever
      - name: Did the domain change?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^apps/api/(src/modules/[^/]+/domain/|src/shared/|stryker\.config\.mjs|vitest\.unit\.config\.mts|package\.json)|^pnpm-lock\.yaml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No domain change: mutation testing skipped" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      # break 100 (stryker.config.mjs): any surviving mutant fails the check
      - if: steps.scope.outputs.run == 'true'
        name: Mutation testing
        run: pnpm --filter @slotly/api test:mutation
      - name: Upload the mutation report
        if: ${{ failure() && steps.scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: apps/api/reports/mutation/
          retention-days: 14
