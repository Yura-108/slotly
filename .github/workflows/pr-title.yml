# The PR title becomes the commit message in main (squash merge), so it must follow
# Conventional Commits (ADR-010). Full CI (lint, types, tests) arrives in stage 8.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# The job only reads an event field; it needs no token permissions.
permissions: {}

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Conventional Commits format
        # The title is untrusted input: pass it through env, never interpolate ${{ }} into the script.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].*$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(bookings): create booking'. Got: $TITLE"
            exit 1
          fi
