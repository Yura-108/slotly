# Dependency updates (security.md, A03). Security updates come as soon as an advisory is
# published; version updates — once a week, grouped, so that the queue of PRs stays short.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspaces use the npm ecosystem
    directories:
      - '/'
      - '/apps/*'
      - '/e2e'
    schedule:
      interval: weekly
      day: monday
    # Fresh releases are not installed (pnpm minimumReleaseAge, ADR-010): a compromised
    # release is usually caught and yanked within days. Security updates ignore cooldown
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 5
    groups:
      # One PR for everything that should not break the code
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker-compose
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
