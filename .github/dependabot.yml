# Dependency updates (security.md, A03). Security updates come as soon as an advisory is
# published; version updates — once a week, grouped, so that the queue of PRs stays short.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspaces use the npm ecosystem
    directories:
      - '/'
      - '/apps/*'
      - '/e2e'
    schedule:
      interval: weekly
      day: monday
    # Fresh releases are not installed (pnpm minimumReleaseAge, ADR-010): a compromised
    # release is usually caught and yanked within days. Security updates ignore cooldown
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    # Major versions are planned migrations (Node 24 pins @types/node 24; TypeScript, Nest,
    # PostgreSQL majors change code or data), not weekly chores: ROADMAP, not a bot PR.
    # Without this each major also came once per workspace directory (ADR-015)
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      # One PR for everything that should not break the code
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker-compose
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    # A PostgreSQL major needs a data migration (pg_upgrade or dump/restore)
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build

  # Base images of apps/api and apps/web, pinned by digest (ADR-018)
  - package-ecosystem: docker
    directories:
      - '/apps/api'
      - '/apps/web'
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    # Node majors follow the project's Node version (ROADMAP), not a weekly update
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      node-image:
        patterns: ['*']
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
