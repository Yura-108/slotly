# Local development infrastructure only (ADR-010).
# api and web run on the host; these credentials are for local use only.
name: slotly

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: slotly
      POSTGRES_PASSWORD: slotly
      POSTGRES_DB: slotly
    ports:
      # Uncommon host port: 5432/5433 are often taken by locally installed PostgreSQL
      - '55432:5432'
    volumes:
      # Since PostgreSQL 18 the image keeps data under /var/lib/postgresql/<major>/,
      # so the volume is mounted one level up
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slotly -d slotly']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    environment:
      # Skip the reverse DNS lookup of the SMTP client: on Docker Desktop it can stall
      # past nodemailer's greeting timeout (found in slice 2 tests)
      MP_SMTP_DISABLE_RDNS: 'true'
    ports:
      - '1025:1025' # SMTP — api sends emails here in development
      - '8025:8025' # web UI to read intercepted emails

volumes:
  postgres-data:
