packages:
  - apps/*
  - packages/*
  - e2e

# Pin exact versions: upgrades are deliberate, separate changes (ADR-004)
saveExact: true

# Dependency install scripts are blocked by default; each one is a reviewed decision.
allowBuilds:
  # Native compilers: scripts verify/repair the platform binary
  '@swc/core': true
  esbuild: true
  # Pulled in by testcontainers for Docker-over-SSH, which we do not use
  ssh2: false
  cpu-features: false
  # Only prints a version notice
  protobufjs: false
  # Install-time telemetry pulled in by swagger-ui-dist (@nestjs/swagger); not needed
  '@scarf/scarf': false

peerDependencyRules:
  allowedVersions:
    # Declares typescript ^5; generation verified on 6.0 (TS 6 keeps the 5.x compiler API)
    openapi-typescript>typescript: '6'

# Security fixes inside the same major, where the parent pins an exact vulnerable version.
# Each entry is removed once the parent moves on (security.md, A03)
overrides:
  # @stryker-mutator/core 10.1 → typed-rest-client 2.3.1 pins qs 6.15.1 (GHSA-6pq8-jhm2-2vcw and
  # three more DoS advisories); typed-rest-client 3.x already requires ^6.16.1
  'typed-rest-client>qs': 6.17.1
